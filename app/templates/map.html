{% extends "base.html" %}
{% block title %}Map — Emne{% endblock %}

{% block content %}
<div class="map-container">
    <div id="map" class="map-fullscreen"></div>
    <div id="sidebar" class="map-sidebar">
        <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">▲ <span id="sidebar-count">0</span> finds</button>
        <ul id="sidebar-list" class="sidebar-list"></ul>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const map = L.map('map').setView([62.0, 10.0], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 19,
    }).addTo(map);

    const markers = L.markerClusterGroup();
    let allFeatures = [];
    let featureLayers = {};
    let userLatLng = null;

    function distanceBetween(a, b) {
        return map.distance(a, b);
    }

    function formatDistance(meters) {
        if (meters < 1000) return Math.round(meters) + ' m';
        return (meters / 1000).toFixed(1) + ' km';
    }

    function updateSidebar() {
        const bounds = map.getBounds();
        const visible = allFeatures.filter(f => {
            const [lng, lat] = f.geometry.coordinates;
            return bounds.contains([lat, lng]);
        });

        if (userLatLng) {
            visible.sort((a, b) => {
                const da = distanceBetween(userLatLng, [a.geometry.coordinates[1], a.geometry.coordinates[0]]);
                const db = distanceBetween(userLatLng, [b.geometry.coordinates[1], b.geometry.coordinates[0]]);
                return da - db;
            });
        }

        const countEl = document.getElementById('sidebar-count');
        const listEl = document.getElementById('sidebar-list');
        countEl.textContent = visible.length;

        listEl.innerHTML = visible.map(f => {
            const p = f.properties;
            const [lng, lat] = f.geometry.coordinates;
            let dist = '';
            if (userLatLng) {
                dist = `<span class="sidebar-distance">${formatDistance(distanceBetween(userLatLng, [lat, lng]))}</span>`;
            }
            return `<li class="sidebar-item" data-id="${p.id}" data-lat="${lat}" data-lng="${lng}">
                <span class="sidebar-title">${p.title}</span>
                <span class="category-badge">${p.category}</span>
                ${dist}
            </li>`;
        }).join('');
    }

    fetch('/api/finds/geojson')
        .then(r => r.json())
        .then(data => {
            allFeatures = data.features;
            L.geoJSON(data, {
                pointToLayer: (feature, latlng) => L.marker(latlng),
                onEachFeature: (feature, layer) => {
                    const p = feature.properties;
                    featureLayers[p.id] = layer;
                    let popup = `<strong><a href="/finds/${p.id}">${p.title}</a></strong><br>`;
                    popup += `<span class="category-badge">${p.category}</span>`;
                    if (p.thumbnail_url) {
                        popup += `<br><img src="${p.thumbnail_url}" style="max-width:150px;margin-top:4px;border-radius:4px;">`;
                    }
                    layer.bindPopup(popup);
                }
            }).addTo(markers);
            map.addLayer(markers);
            if (data.features.length > 0) {
                map.fitBounds(markers.getBounds(), {padding: [20, 20]});
            }
            updateSidebar();
        });

    map.on('moveend', updateSidebar);

    // "Record here" button
    const recordBtn = L.control({position: 'bottomright'});
    recordBtn.onAdd = function() {
        const div = L.DomUtil.create('div', 'leaflet-bar');
        div.innerHTML = '<a href="#" id="record-here-btn" title="Record find at current location" style="font-size:18px;padding:6px 10px;display:block;background:#fff;">📍 Record Here</a>';
        return div;
    };
    recordBtn.addTo(map);

    // User location tracking
    let userMarker = null;
    let userCircle = null;

    function showUserLocation(latlng, accuracy) {
        userLatLng = latlng;
        if (userMarker) {
            userMarker.setLatLng(latlng);
            userCircle.setLatLng(latlng).setRadius(accuracy);
        } else {
            userMarker = L.circleMarker(latlng, {
                radius: 8, color: '#fff', weight: 2,
                fillColor: '#2563eb', fillOpacity: 1
            }).addTo(map);
            userCircle = L.circle(latlng, {
                radius: accuracy, color: '#2563eb', fillColor: '#2563eb',
                fillOpacity: 0.08, weight: 1
            }).addTo(map);
        }
        updateSidebar();
    }

    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
            pos => showUserLocation(
                [pos.coords.latitude, pos.coords.longitude],
                pos.coords.accuracy
            ),
            () => {},
            {enableHighAccuracy: true, maximumAge: 10000}
        );
    }

    // "Center on me" button
    const locateBtn = L.control({position: 'topleft'});
    locateBtn.onAdd = function() {
        const div = L.DomUtil.create('div', 'leaflet-bar');
        div.innerHTML = '<a href="#" id="locate-btn" title="Center on my location" style="font-size:18px;padding:6px 10px;display:block;background:#fff;">⊕</a>';
        return div;
    };
    locateBtn.addTo(map);

    document.addEventListener('click', function(e) {
        if (e.target.id === 'locate-btn' || e.target.closest('#locate-btn')) {
            e.preventDefault();
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const latlng = [pos.coords.latitude, pos.coords.longitude];
                        showUserLocation(latlng, pos.coords.accuracy);
                        map.setView(latlng, 16);
                    },
                    () => alert('Could not get your location'),
                    {enableHighAccuracy: true}
                );
            }
        }
    });

    document.addEventListener('click', function(e) {
        if (e.target.id === 'record-here-btn' || e.target.closest('#record-here-btn')) {
            e.preventDefault();
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        window.location.href = `/finds/new?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`;
                    },
                    () => {
                        const center = map.getCenter();
                        window.location.href = `/finds/new?lat=${center.lat}&lon=${center.lng}`;
                    },
                    {enableHighAccuracy: true}
                );
            }
        }
    });

    // Sidebar toggle
    document.getElementById('sidebar-toggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('collapsed');
    });

    // Sidebar item click — open popup on map
    document.getElementById('sidebar-list').addEventListener('click', function(e) {
        const item = e.target.closest('.sidebar-item');
        if (!item) return;
        const id = item.dataset.id;
        const lat = parseFloat(item.dataset.lat);
        const lng = parseFloat(item.dataset.lng);
        map.setView([lat, lng], 16);
        const layer = featureLayers[id];
        if (layer) {
            markers.zoomToShowLayer(layer, () => layer.openPopup());
        }
    });
</script>
{% endblock %}
