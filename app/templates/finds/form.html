{% extends "base.html" %}
{% block title %}{% if find %}Edit {{ find.title }}{% else %}New Find{% endif %} — Emne{% endblock %}

{% block content %}
<div class="form-page">
    <h1>{% if find %}Edit Find{% else %}New Find{% endif %}</h1>

    <form method="post"
          action="{% if find %}/finds/{{ find.id }}/edit{% else %}/finds{% endif %}"
          enctype="multipart/form-data">

        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required
                   value="{{ find.title if find else '' }}"
                   placeholder="e.g. Twisted Pine, Birch Burl, Mossy Rock">
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
                {% for cat in ['tree', 'sapling', 'burl', 'rock', 'mushroom', 'viewpoint', 'deadwood', 'other'] %}
                <option value="{{ cat }}" {% if (find and find.category == cat) or (not find and cat == 'other') %}selected{% endif %}>
                    {{ cat|capitalize }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3"
                      placeholder="Notes about this find...">{{ find.description if find and find.description else '' }}</textarea>
        </div>

        <div class="form-group location-group">
            <label>Location</label>
            <div class="location-inputs">
                <input type="number" step="any" id="latitude" name="latitude" required
                       placeholder="Latitude" value="{{ lat if lat else '' }}">
                <input type="number" step="any" id="longitude" name="longitude" required
                       placeholder="Longitude" value="{{ lon if lon else '' }}">
                <input type="hidden" id="accuracy" name="accuracy" value="">
            </div>
            <div class="sampling-controls">
                <button type="button" id="start-sampling-btn" class="btn btn-sm">📍 Lock Location</button>
                <button type="button" id="stop-sampling-btn" class="btn btn-sm" style="display:none">✓ Done</button>
                <button type="button" id="cancel-sampling-btn" class="btn btn-sm" style="display:none">✕ Cancel</button>
            </div>
            <div id="sampling-status" class="location-status"></div>
        </div>

        <div id="form-map" class="form-map"></div>

        <div class="form-group">
            <label>{% if find %}Add Photos{% else %}Photos{% endif %}</label>
            <input type="file" id="photos" name="photos" accept="image/*" multiple style="display:none">
            <div class="capture-controls" style="margin-bottom:0.5rem">
                <button type="button" id="quick-capture-btn" class="btn btn-sm">📷 Quick Capture</button>
                <button type="button" id="browse-photos-btn" class="btn btn-sm">📁 Browse Library</button>
                <button type="button" id="capture-stop-btn" class="btn btn-sm" style="display:none">✓ Done Capturing</button>
                <span id="capture-count" class="capture-count"></span>
            </div>
            <div class="capture-viewfinder" id="capture-viewfinder" style="display:none">
                <video id="capture-video" autoplay playsinline muted></video>
                <canvas id="capture-canvas" style="display:none"></canvas>
                <button type="button" id="shutter-btn" class="shutter-btn" title="Capture"></button>
            </div>
            <div class="capture-queue" id="capture-queue"></div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{% if find %}Save Changes{% else %}Create Find{% endif %}</button>
            <a href="{% if find %}/finds/{{ find.id }}{% else %}/finds{% endif %}" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    const latInput = document.getElementById('latitude');
    const lonInput = document.getElementById('longitude');
    const accInput = document.getElementById('accuracy');
    const statusEl = document.getElementById('sampling-status');

    const lat = parseFloat(latInput.value) || 62.0;
    const lon = parseFloat(lonInput.value) || 10.0;
    const hasCoords = latInput.value !== '';
    const zoom = hasCoords ? 15 : 5;

    const formMap = L.map('form-map').setView([lat, lon], zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OSM',
    }).addTo(formMap);

    let marker = hasCoords ? L.marker([lat, lon]).addTo(formMap) : null;
    let sampleDots = [];

    formMap.on('click', function(e) {
        const {lat, lng} = e.latlng;
        latInput.value = lat.toFixed(6);
        lonInput.value = lng.toFixed(6);
        accInput.value = '';
        if (marker) {
            marker.setLatLng(e.latlng);
        } else {
            marker = L.marker(e.latlng).addTo(formMap);
        }
    });

    // --- GPS Multi-Sampling ---
    const TARGET_ACCURACY = 5; // meters
    const TIMEOUT = 30000; // 30 seconds
    let samples = [];
    let watchId = null;
    let samplingTimer = null;

    function median(arr) {
        const sorted = [...arr].sort((a, b) => a - b);
        const mid = Math.floor(sorted.length / 2);
        return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function filterOutliers(samples) {
        if (samples.length < 3) return samples;
        const accuracies = samples.map(s => s.accuracy);
        const med = median(accuracies);
        return samples.filter(s => s.accuracy <= med * 2);
    }

    function computeAverage(samples) {
        const filtered = filterOutliers(samples);
        if (filtered.length === 0) return null;
        const avgLat = filtered.reduce((s, r) => s + r.lat, 0) / filtered.length;
        const avgLng = filtered.reduce((s, r) => s + r.lng, 0) / filtered.length;
        // Effective accuracy: average of individual accuracies divided by sqrt(n)
        const avgAcc = filtered.reduce((s, r) => s + r.accuracy, 0) / filtered.length;
        const effectiveAcc = avgAcc / Math.sqrt(filtered.length);
        return {lat: avgLat, lng: avgLng, accuracy: effectiveAcc, count: filtered.length};
    }

    function clearSampleDots() {
        sampleDots.forEach(d => formMap.removeLayer(d));
        sampleDots = [];
    }

    function updateSamplingUI() {
        const avg = computeAverage(samples);
        if (!avg) return;

        statusEl.innerHTML = `Sampling... <strong>${samples.length}</strong> readings — ±${avg.accuracy.toFixed(1)}m`;

        // Update marker to averaged position
        if (marker) {
            marker.setLatLng([avg.lat, avg.lng]);
        } else {
            marker = L.marker([avg.lat, avg.lng]).addTo(formMap);
        }

        // Auto-stop if accuracy target reached
        if (avg.accuracy <= TARGET_ACCURACY && samples.length >= 3) {
            finishSampling();
        }
    }

    function finishSampling() {
        stopWatching();
        const avg = computeAverage(samples);
        if (!avg) {
            statusEl.textContent = 'No valid readings obtained';
            return;
        }
        latInput.value = avg.lat.toFixed(6);
        lonInput.value = avg.lng.toFixed(6);
        accInput.value = avg.accuracy.toFixed(1);
        formMap.setView([avg.lat, avg.lng], 17);
        if (marker) marker.setLatLng([avg.lat, avg.lng]);
        statusEl.innerHTML = `Location locked: <strong>±${avg.accuracy.toFixed(1)}m</strong> (${avg.count} readings)`;
        showButtons('start');
    }

    function stopWatching() {
        if (watchId !== null) {
            clearInterval(watchId);
            watchId = null;
        }
        if (samplingTimer) {
            clearTimeout(samplingTimer);
            samplingTimer = null;
        }
    }

    function showButtons(mode) {
        document.getElementById('start-sampling-btn').style.display = mode === 'start' ? '' : 'none';
        document.getElementById('stop-sampling-btn').style.display = mode === 'sampling' ? '' : 'none';
        document.getElementById('cancel-sampling-btn').style.display = mode === 'sampling' ? '' : 'none';
    }

    function startSampling() {
        if (!navigator.geolocation) {
            statusEl.textContent = 'Geolocation not supported';
            return;
        }
        samples = [];
        clearSampleDots();
        showButtons('sampling');
        statusEl.textContent = 'Sampling... waiting for GPS...';

        function takeSample() {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    const {latitude, longitude, accuracy} = pos.coords;
                    samples.push({lat: latitude, lng: longitude, accuracy});

                    // Draw sample dot on map
                    const dot = L.circleMarker([latitude, longitude], {
                        radius: 4, color: '#999', weight: 1, fillColor: '#bbb', fillOpacity: 0.6
                    }).addTo(formMap);
                    sampleDots.push(dot);

                    if (samples.length === 1) {
                        formMap.setView([latitude, longitude], 17);
                    }
                    updateSamplingUI();
                },
                err => {
                    if (err.code === 1) {
                        statusEl.innerHTML = 'Location denied. <br><small>Safari: tap <b>Aa</b> in address bar → Website Settings → Location → Allow.</small>';
                        stopWatching();
                        showButtons('start');
                    }
                },
                {enableHighAccuracy: true, maximumAge: 0, timeout: 8000}
            );
        }
        takeSample();
        watchId = setInterval(takeSample, 1500);

        // Safety timeout
        samplingTimer = setTimeout(() => {
            if (samples.length > 0) {
                finishSampling();
            } else {
                stopWatching();
                statusEl.textContent = 'Timed out — no GPS readings received';
                showButtons('start');
            }
        }, TIMEOUT);
    }

    document.getElementById('start-sampling-btn').addEventListener('click', startSampling);
    document.getElementById('stop-sampling-btn').addEventListener('click', finishSampling);
    document.getElementById('cancel-sampling-btn').addEventListener('click', function() {
        stopWatching();
        clearSampleDots();
        samples = [];
        statusEl.textContent = 'Cancelled';
        showButtons('start');
    });

    // Auto-start sampling if no coords provided
    if (!hasCoords && navigator.geolocation) {
        startSampling();
    }

    // --- Quick Capture for form ---
    const captureVideo = document.getElementById('capture-video');
    const captureCanvas = document.getElementById('capture-canvas');
    const captureViewfinder = document.getElementById('capture-viewfinder');
    const photosInput = document.getElementById('photos');
    const captureQueue = document.getElementById('capture-queue');
    const captureCountEl = document.getElementById('capture-count');
    const shutterBtn = document.getElementById('shutter-btn');
    const captureStopBtn = document.getElementById('capture-stop-btn');
    let capturedFiles = [];
    let cameraStream = null;

    function updateFormCaptureUI() {
        const n = capturedFiles.filter(f => f !== null).length;
        captureCountEl.textContent = n > 0 ? `${n} photo${n > 1 ? 's' : ''} queued` : '';
    }

    function syncFilesToInput() {
        const dt = new DataTransfer();
        capturedFiles.filter(f => f !== null).forEach(f => dt.items.add(f));
        photosInput.files = dt.files;
    }

    function stopCamera() {
        if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
            cameraStream = null;
        }
        captureViewfinder.style.display = 'none';
        captureStopBtn.style.display = 'none';
    }

    async function startCamera() {
        try {
            cameraStream = await navigator.mediaDevices.getUserMedia({
                video: {facingMode: 'environment', width: {ideal: 1920}, height: {ideal: 1440}},
                audio: false
            });
            captureVideo.srcObject = cameraStream;
            captureViewfinder.style.display = '';
            captureStopBtn.style.display = '';
        } catch (err) {
            alert('Could not access camera: ' + err.message);
            stopCamera();
        }
    }

    function takeSnapshot() {
        const track = cameraStream && cameraStream.getVideoTracks()[0];
        if (!track) return;
        const settings = track.getSettings();
        captureCanvas.width = settings.width || captureVideo.videoWidth;
        captureCanvas.height = settings.height || captureVideo.videoHeight;
        const ctx = captureCanvas.getContext('2d');
        ctx.drawImage(captureVideo, 0, 0, captureCanvas.width, captureCanvas.height);
        captureCanvas.toBlob(function(blob) {
            if (!blob) return;
            const file = new File([blob], `capture_${Date.now()}.jpg`, {type: 'image/jpeg'});
            capturedFiles.push(file);
            const thumb = document.createElement('div');
            thumb.className = 'capture-thumb';
            const img = document.createElement('img');
            img.src = URL.createObjectURL(blob);
            thumb.appendChild(img);
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.textContent = '✕';
            removeBtn.className = 'capture-thumb-remove';
            const idx = capturedFiles.length - 1;
            removeBtn.addEventListener('click', function() {
                capturedFiles[idx] = null;
                thumb.remove();
                updateFormCaptureUI();
                syncFilesToInput();
            });
            thumb.appendChild(removeBtn);
            captureQueue.appendChild(thumb);
            updateFormCaptureUI();
            syncFilesToInput();
        }, 'image/jpeg', 0.85);
    }

    function addFilesToQueue(files) {
        for (const file of files) {
            capturedFiles.push(file);
            const thumb = document.createElement('div');
            thumb.className = 'capture-thumb';
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            thumb.appendChild(img);
            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.textContent = '✕';
            removeBtn.className = 'capture-thumb-remove';
            const idx = capturedFiles.length - 1;
            removeBtn.addEventListener('click', function() {
                capturedFiles[idx] = null;
                thumb.remove();
                updateFormCaptureUI();
                syncFilesToInput();
            });
            thumb.appendChild(removeBtn);
            captureQueue.appendChild(thumb);
        }
        updateFormCaptureUI();
        syncFilesToInput();
    }

    document.getElementById('quick-capture-btn').addEventListener('click', function() {
        startCamera();
    });

    captureStopBtn.addEventListener('click', function() {
        stopCamera();
    });

    shutterBtn.addEventListener('click', takeSnapshot);

    document.getElementById('browse-photos-btn').addEventListener('click', function() {
        stopCamera();
        const browseInput = document.createElement('input');
        browseInput.type = 'file';
        browseInput.accept = 'image/*';
        browseInput.multiple = true;
        browseInput.addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                addFilesToQueue(this.files);
            }
        });
        browseInput.click();
    });
</script>
{% endblock %}
