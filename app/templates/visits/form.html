{% extends "base.html" %}
{% block title %}New Visit — {{ find.title }} — Emne{% endblock %}

{% block content %}
<div class="form-page">
    <h1>Add Visit to "{{ find.title }}"</h1>

    <form method="post" action="/finds/{{ find.id }}/visits" enctype="multipart/form-data">
        <div class="form-group">
            <label for="visited_at">Date of Visit</label>
            <input type="date" id="visited_at" name="visited_at" value="{{ today }}">
        </div>

        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="4"
                      placeholder="What did you observe? How has it changed?"></textarea>
        </div>

        <div class="form-group">
            <label for="photos">Photos</label>
            <input type="file" id="photos" name="photos" accept="image/*" multiple>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Visit</button>
            <a href="/finds/{{ find.id }}" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
