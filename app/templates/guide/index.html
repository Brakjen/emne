{% extends "base.html" %}
{% block title %}Field Guide — Emne{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📖 Field Guide</h1>
</div>

<p class="guide-intro">Reusable field knowledge that doesn't need an AI call.</p>

<div class="guide-grid">
    {% for article in articles %}
    <a href="/guide/{{ article.slug }}" class="guide-card">
        <span class="guide-card-icon">{{ article.icon }}</span>
        <div class="guide-card-text">
            <h3>{{ article.title }}</h3>
            <p>{{ article.description }}</p>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
