<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Emne{% endblock %}</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2d5016">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="/static/css/style.css?v={{ version }}">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <nav class="bottom-nav">
        <a href="/finds" class="bottom-nav-item">📋 Finds</a>
        <a href="/map" class="bottom-nav-item">🗺️ Map</a>
        <a href="/finds/new" class="bottom-nav-item bottom-nav-new">＋ New</a>
        <a href="/ai" class="bottom-nav-item">🤖 AI</a>
        <a href="/guide" class="bottom-nav-item">📖 Guide</a>
        <a href="/settings" class="bottom-nav-item">⚙️ Settings</a>
        <span class="nav-version">{{ version }}</span>
    </nav>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    {% block scripts %}{% endblock %}
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>
</html>
