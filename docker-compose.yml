services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: emne
      POSTGRES_USER: emne
      POSTGRES_PASSWORD: emne
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbucket:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/emne-photos --ignore-existing;
      exit 0;
      "

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - minio
    environment:
      EMNE_DATABASE_URL: postgresql+asyncpg://emne:emne@db:5432/emne
      EMNE_SECRET_KEY: dev-secret-key-change-in-prod
      EMNE_AUTH_PASSWORD_HASH: "$$2b$$12$$S3smJOCUcEocd12f9kPd3e/ZMCReXafuc5vgOjiv.p/lezt8.dUaq"
      EMNE_S3_ENDPOINT_URL: http://minio:9000
      EMNE_S3_ACCESS_KEY_ID: minioadmin
      EMNE_S3_SECRET_ACCESS_KEY: minioadmin
      EMNE_S3_BUCKET_NAME: emne-photos

volumes:
  pgdata:
  miniodata:
